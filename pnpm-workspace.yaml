  "@effect/platform-node": 4.1.4
  "@effect/platform-node-shared": 4.1.4
  "@earendil-works/pi-coding-agent>undici": 8.12.2
  "postcss>source-map-js": 1.2.2
  # Vitest pins its own Vite; keep every copy on the patched release.
  "vite@<8.2.4": 8.2.4

# app-builder-lib (desktop release tooling) names Windows and DMG builders as peers;
# neither target is built from the root.
peerDependencyRules:
  ignoreMissing:
    # The imported Node services never load the optional Redis adapter.
    - redis
    - dmg-builder
    - electron-builder-squirrel-windows
  # These transitive build tools use APIs exercised by the imported build.
  allowedVersions:
    "capnp-es>typescript": "7.0.2"
    "@cloudflare/unenv-preset>unenv": "2.0.0-rc.25"
