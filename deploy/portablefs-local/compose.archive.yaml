# Optional archive-tier overlay for the single-node PortableFS stack: a MinIO
# archive store plus the root-provisioned credentials the manager and cell
# consume. Without this overlay the stack runs exactly as before and volumes
# simply never archive — the archive store is a declared capability, not a
# fallback.
#
#   docker compose -f compose.yaml -f compose.archive.yaml up -d
#
# The credentials file is operator-provisioned (never generated by the
# launcher): create ${PORTABLEFS_LOCAL_ARCHIVE_DIR}/cell-archive.env with the
# PORTABLEFS_ARCHIVE_* keys documented in the PortableFS tree
# (vcs/internal/archivestore/config.go) pointing at this MinIO service, e.g.
#
#   PORTABLEFS_ARCHIVE_ENDPOINT=http://archive-store:9000
#   PORTABLEFS_ARCHIVE_REGION=us-east-1
#   PORTABLEFS_ARCHIVE_BUCKET=example-archive
#   PORTABLEFS_ARCHIVE_PREFIX=archives
#   PORTABLEFS_ARCHIVE_ACCESS_KEY_ID=...
#   PORTABLEFS_ARCHIVE_SECRET_ACCESS_KEY=...
#   PORTABLEFS_ARCHIVE_CHECKSUM_CAPABILITY=none
#   PORTABLEFS_ARCHIVE_PATH_STYLE=true
services:
  archive-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/archive-root-user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/archive-root-password
    networks:
      - control
    secrets:
      - archive-root-user
      - archive-root-password
    volumes:
      - archive-data:/data

  manager:
    environment:
      PORTABLEFS_MANAGER_ARCHIVE_CREDENTIALS: /archive-credentials/cell-archive.env
    volumes:
      - type: bind
        source: ${PORTABLEFS_LOCAL_ARCHIVE_DIR:?set PORTABLEFS_LOCAL_ARCHIVE_DIR}
        target: /archive-credentials
        read_only: true
        bind:
          create_host_path: false

  cell:
    volumes:
      - type: bind
        source: ${PORTABLEFS_LOCAL_ARCHIVE_DIR:?set PORTABLEFS_LOCAL_ARCHIVE_DIR}/cell-archive.env
        target: /etc/portablefs/cells/${PORTABLEFS_CELL_ID}-archive.env
        read_only: true
        bind:
          create_host_path: false

secrets:
  archive-root-user:
    file: ${PORTABLEFS_LOCAL_ARCHIVE_DIR:?set PORTABLEFS_LOCAL_ARCHIVE_DIR}/root-user
  archive-root-password:
    file: ${PORTABLEFS_LOCAL_ARCHIVE_DIR:?set PORTABLEFS_LOCAL_ARCHIVE_DIR}/root-password

volumes:
  archive-data:
