apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-provisioner
  namespace: opensteer-teams
  annotations:
    # Lets the deploy refuse to replace a newer release with an older one.
    opensteer.dev/source-revision: "@SOURCE_REVISION@"
spec:
  replicas: 1
  # One provisioner at a time, so teams roll one at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: team-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-provisioner
    spec:
      serviceAccountName: team-provisioner
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: team-provisioner
          image: "@PROVISIONER_IMAGE@"
          env:
            - { name: OPENSTEER_ACCOUNT_URL, value: https://accounts.opensteer.com }
            - { name: OPENSTEER_TEAM_HOST_IMAGE, value: "@TEAM_HOST_IMAGE@" }
          envFrom:
            - configMapRef: { name: team-platform }
          volumeMounts:
            - { name: database-ca, mountPath: /etc/opensteer/team-database, readOnly: true }
          ports:
            - { name: readiness, containerPort: 8081 }
          # Ready only after a whole reconcile pass succeeds, so a release that cannot reach
          # Account or list teams fails its rollout and holds for a forward fix.
          readinessProbe:
            httpGet: { path: /readyz, port: readiness }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: database-ca
          configMap: { name: team-database-ca }
