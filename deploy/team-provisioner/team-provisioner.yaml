apiVersion: v1
kind: Namespace
metadata:
  name: opensteer-teams
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-provisioner
  namespace: opensteer-teams
  annotations:
    # The one Google identity Account's OPENSTEER_HOSTED_TEAMS_PROVISIONER_EMAIL admits.
    iam.gke.io/gcp-service-account: team-provisioner@opensteer-prod.iam.gserviceaccount.com
---
# Every object the provisioner changes inside a team namespace is named `team`; it may create
# others but never read or change them, so other namespaces' Secrets stay out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensteer-team-provisioner
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [limitranges, resourcequotas, secrets, services]
    verbs: [create]
  - apiGroups: [""]
    resources: [limitranges, resourcequotas, secrets, services]
    resourceNames: [team]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [team]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [list, create]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [team]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensteer-team-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensteer-team-provisioner
subjects:
  - kind: ServiceAccount
    name: team-provisioner
    namespace: opensteer-teams
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-provisioner
  namespace: opensteer-teams
  annotations:
    # Lets the deploy refuse to replace a newer release with an older one.
    opensteer.dev/source-revision: "@SOURCE_REVISION@"
spec:
  replicas: 1
  # One provisioner at a time, so teams roll one at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: team-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-provisioner
    spec:
      serviceAccountName: team-provisioner
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: team-provisioner
          image: "@PROVISIONER_IMAGE@"
          env:
            - { name: OPENSTEER_ACCOUNT_URL, value: https://accounts.opensteer.com }
            - { name: OPENSTEER_TEAM_HOST_IMAGE, value: "@TEAM_HOST_IMAGE@" }
            - { name: OPENSTEER_TEAM_GATEWAY_IMAGE, value: "@TEAM_GATEWAY_IMAGE@" }
            # The same Postgres as deploy/team/compose.yaml.
            - {
                name: OPENSTEER_TEAM_POSTGRES_IMAGE,
                value: "docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15",
              }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
