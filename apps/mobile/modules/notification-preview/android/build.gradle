plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.opensteer.notificationpreview'
version = '1.0.0'
android {
  namespace 'com.opensteer.notificationpreview'
  compileOptions { coreLibraryDesugaringEnabled true }
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  // The manifest service exposes Expo and Firebase in its public superclass chain.
  api project(':expo-notifications')
  api platform('com.google.firebase:firebase-bom:34.4.0')
  api 'com.google.firebase:firebase-messaging'
  testImplementation 'junit:junit:4.13.2'
}
