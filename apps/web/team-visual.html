<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks and teams visual QA</title>
    <style>
      /* Harness-only: the sidebar's own body and footer, drawn without the
         client that fills them in the app. */
      .visual-sidebar {
        display: flex;
        flex-direction: column;
      }
      .visual-sidebar__scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: 8px;
      }
      .visual-side-list {
        overflow: visible;
      }
      .visual-sidebar .team-section {
        padding-inline: 0;
      }
      .visual-tabs {
        flex: none;
        padding: 0 6px 6px;
        border-top: 1px solid var(--line);
      }
      .visual-tab-icon {
        width: 16px;
        height: 16px;
        margin-inline: 2px;
        color: var(--muted);
      }
      .visual-place {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
      }
      .visual-place > span:last-child {
        display: flex;
        flex-direction: column;
      }
      .visual-place__mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--rim-plate);
        border-radius: var(--radius-sm);
        color: var(--text-soft);
      }
      .visual-place__mark svg {
        width: 16px;
        height: 16px;
      }
      .visual-place__name {
        font-size: var(--text-lg);
        font-weight: var(--weight-strong);
      }
      .visual-place__status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: var(--text-sm);
      }
      .visual-settings-nav {
        padding: 0 10px;
      }
      .visual-settings-nav__title {
        margin: 0 0 10px;
        padding: 0 8px;
        font-size: var(--display-xs);
        font-weight: var(--weight-bold);
      }
      .visual-settings-nav__link {
        margin: 0;
        padding: 8px;
        color: var(--text-soft);
        font-size: var(--text-lg);
      }
      .visual-settings-nav__caption {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 4px;
        padding: 0 8px;
        color: var(--muted);
        font-size: var(--text-xs);
        font-weight: var(--weight-strong);
      }
      .visual-gallery {
        display: flex;
        gap: 24px;
        min-height: 100dvh;
        padding: 32px;
        background: var(--bg);
      }
      .visual-gallery--grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-content: start;
        align-items: start;
        gap: 18px;
      }
      .visual-gallery--cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 10px 24px;
        padding: 24px;
        background: var(--fill-sheet);
        --ground: var(--fill-sheet);
      }
      .visual-gallery--composers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 24px 32px;
        padding: 32px;
        background: var(--fill-sheet);
        --ground: var(--fill-sheet);
      }
      .visual-composer-cell[data-cell] {
        padding-top: 300px;
      }
      .visual-wide {
        grid-column: 1 / -1;
      }
      .visual-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .visual-cell {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .visual-gallery--join {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .visual-sheet {
        display: flex;
        flex: 1;
        border: 1px solid var(--rim-sheet);
        border-radius: var(--radius-lg);
        background: var(--fill-sheet);
        --ground: var(--fill-sheet);
      }
      .visual-label {
        margin: 6px 0 2px;
        color: var(--muted);
        font-size: var(--text-xs);
        font-weight: var(--weight-heavy);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .visual-card-cell .tmsg {
        padding-inline: 0;
      }
      .visual-card-cell .tlist__rows {
        min-height: 0;
      }
      .visual-popover-sample {
        width: fit-content;
        padding: 6px;
        border: 1px solid var(--rim-plate);
        border-radius: var(--radius-md);
        background: var(--sheen) var(--fill-float);
        box-shadow: var(--edge-plate), var(--lift-float);
      }
      .visual-index {
        padding: 40px;
        font-size: 15px;
      }
      .visual-index li {
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/team-visual.tsx"></script>
  </body>
</html>
