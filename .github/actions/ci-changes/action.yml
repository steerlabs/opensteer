name: CI changes
description: Fail-open plan of the lanes and test files a change can affect
outputs:
  tests-shards:
    value: ${{ steps.detect.outputs.tests-shards }}
  integration-shards:
    value: ${{ steps.detect.outputs.integration-shards }}
  native-mac-tasks:
    value: ${{ steps.detect.outputs.native-mac-tasks }}
  typecheck-filters:
    value: ${{ steps.detect.outputs.typecheck-filters }}
  build-filters:
    value: ${{ steps.detect.outputs.build-filters }}
  lint:
    value: ${{ steps.detect.outputs.lint }}
  build-types:
    value: ${{ steps.detect.outputs.build-types }}
  build:
    value: ${{ steps.detect.outputs.build }}
  tests:
    value: ${{ steps.detect.outputs.tests }}
  integration:
    value: ${{ steps.detect.outputs.integration }}
  native-mac:
    value: ${{ steps.detect.outputs.native-mac }}
  native-windows:
    value: ${{ steps.detect.outputs.native-windows }}
  android:
    value: ${{ steps.detect.outputs.android }}
  browser-journeys:
    value: ${{ steps.detect.outputs.browser-journeys }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node .github/scripts/ci-changes.mjs
