name: CI Chromium
description: Cache exact resolved Playwright browsers; always install system dependencies
runs:
  using: composite
  steps:
    - id: revision
      shell: bash
      run: echo "key=$(node -e 'const c=require("node:crypto"); const fs=require("node:fs"); console.log(c.createHash("sha256").update(fs.readFileSync(require("node:path").join(require.resolve("playwright-core/package.json"), "..", "browsers.json"))).digest("hex"))')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.key }}
    - name: Use Ubuntu's primary package mirror
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        # The Azure mirror can spend most of a shard's budget downloading fonts.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -E -i 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
    - shell: bash
      run: pnpm exec playwright-core install --with-deps chromium
    # Otherwise tests fall back to the runner image's Chrome or Chromium. Nothing has
    # read those binaries yet, and paging one in from disk can outlast the Browser
    # Runtime's 30 s attach bound. This is the pinned Chromium its container ships.
    - shell: bash
      run: echo "OPENSTEER_CHROMIUM_EXECUTABLE=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
