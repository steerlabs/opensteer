name: CI Chromium
description: Cache exact resolved Playwright browsers and verify runner compatibility
runs:
  using: composite
  steps:
    - id: revision
      shell: bash
      run: echo "key=$(node -e 'const c=require("node:crypto"); const fs=require("node:fs"); console.log(c.createHash("sha256").update(fs.readFileSync(require("node:path").join(require.resolve("playwright-core/package.json"), "..", "browsers.json"))).digest("hex"))')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.key }}
    # Hosted runners already include Chromium's system libraries. Installing them
    # again makes every test shard depend on live Ubuntu package mirrors.
    - shell: bash
      run: pnpm exec playwright-core install chromium
    - name: Verify pinned Chromium starts on this runner
      shell: bash
      run: |
        node --input-type=module <<'JS'
        import { chromium } from 'playwright-core';
        const browser = await chromium.launch({
          executablePath: chromium.executablePath(),
          headless: true,
          timeout: 15_000,
        });
        await browser.close();
        JS
    # Suites must use the same pinned browser we verified, rather than falling
    # back to the runner image's Chrome or Chromium.
    - shell: bash
      run: echo "OPENSTEER_CHROMIUM_EXECUTABLE=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
