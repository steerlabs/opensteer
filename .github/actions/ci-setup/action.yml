name: CI dependencies
description: Frozen install with toolchain and dependency caches
inputs:
  go:
    description: Install Go and restore compiler caches for Go consumers
    default: "true"
outputs:
  go-cache-key:
    description: Source-qualified compiler cache key
    value: ${{ steps.go-cache.outputs.cache-primary-key }}
  go-cache-paths:
    description: Module and compiler cache directories
    value: ${{ steps.go-paths.outputs.paths }}
  go-cache-hit:
    description: Whether the primary compiler cache key was restored
    value: ${{ steps.go-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24.13.0"
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: apps/runner/native-fs-helper/go.mod
        cache: false
    - id: go-paths
      if: inputs.go == 'true'
      shell: bash
      env:
        GOPROXY: "https://proxy.golang.org|direct"
      run: |
        echo "GOPROXY=$GOPROXY" >> "$GITHUB_ENV"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<GO_CACHE_PATHS'
          go env GOMODCACHE GOCACHE
          echo 'GO_CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
    # All builds still run: Go validates restored compiler objects against inputs.
    # Source-qualified keys let successful compilers refresh immutable entries.
    - id: go-cache
      if: inputs.go == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-paths.outputs.paths }}
        key: go-compiler-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-paths.outputs.version }}-${{ hashFiles('apps/runner/native-fs-helper/go.mod', 'apps/runner/native-fs-helper/go.sum', 'apps/desktop/process-supervisor/go.mod', 'apps/desktop/process-supervisor/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-compiler-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-paths.outputs.version }}-${{ hashFiles('apps/runner/native-fs-helper/go.mod', 'apps/runner/native-fs-helper/go.sum', 'apps/desktop/process-supervisor/go.mod', 'apps/desktop/process-supervisor/go.sum') }}-
    - shell: bash
      run: corepack enable
    - id: store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.store.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
