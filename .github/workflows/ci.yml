name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  # Main picks its macOS tasks per push; this full run backs that up, and skips
  # when main has not changed since the last full run.
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      # A scheduled run reads which commit the last full run covered.
      actions: read
    outputs:
      tests-shards: ${{ steps.changes.outputs.tests-shards }}
      integration-shards: ${{ steps.changes.outputs.integration-shards }}
      native-mac-tasks: ${{ steps.changes.outputs.native-mac-tasks }}
      lint: ${{ steps.changes.outputs.lint }}
      build-types: ${{ steps.changes.outputs.build-types }}
      tests: ${{ steps.changes.outputs.tests }}
      integration: ${{ steps.changes.outputs.integration }}
      native-mac: ${{ steps.changes.outputs.native-mac }}
      android: ${{ steps.changes.outputs.android }}
      browser-journeys: ${{ steps.changes.outputs.browser-journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
      - id: changes
        uses: ./.github/actions/ci-changes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan-${{ github.sha }}
          path: ci-plan.json
          if-no-files-found: error
  lint:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.lint != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The test-lint baseline must be compared with its merge base on main.
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - run: mkdir -p "$RUNNER_TEMP/evidence"
      - shell: bash
        run: |
          set -o pipefail
          {
            pnpm format:check
            pnpm lint
            node --test .github/scripts/*.test.mjs
            node .github/scripts/fork-safety.mjs .github/workflows/ci.yml
          } 2>&1 | tee "$RUNNER_TEMP/evidence/lint.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
          if-no-files-found: error
  build-types:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.build-types != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: mkdir -p "$RUNNER_TEMP/evidence"
      - shell: bash
        run: |
          set -o pipefail
          {
            pnpm typecheck
            pnpm build
          } 2>&1 | tee "$RUNNER_TEMP/evidence/build-types.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-types-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
          if-no-files-found: error
  tests:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.tests != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.tests-shards) }}
    env:
      CI_LANE: tests
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: |-
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "CI_DISCOVERY_PATH=$RUNNER_TEMP/evidence/$CI_LANE-$CI_SHARD.discovered.json"
            echo "CI_INVENTORY_PATH=$RUNNER_TEMP/evidence/$CI_LANE-$CI_SHARD.inventory.json"
          } >> "$GITHUB_ENV"
        shell: bash
      - uses: ./.github/actions/ci-browser
      - run: pnpm exec vitest list --filesOnly --json "$CI_DISCOVERY_PATH"
      - shell: bash
        run: |
          set -o pipefail
          pnpm pretest
          pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=junit --reporter=json --reporter=./scripts/ci-inventory-reporter.ts --outputFile.junit="$RUNNER_TEMP/evidence/tests-${{ matrix.shard }}.xml" --outputFile.json="$RUNNER_TEMP/evidence/tests-${{ matrix.shard }}.results.json" 2>&1 | tee "$RUNNER_TEMP/evidence/tests-${{ matrix.shard }}.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-${{ matrix.shard }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
          if-no-files-found: error
  integration:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.integration-shards) }}
    env:
      CI_LANE: integration
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: ${{ strategy.job-total }}
      OPENSTEER_LOCK_ORDER_MODE: enforce
    # pnpm test:integration starts its own disposable PostgreSQL on tmpfs, as it
    # does locally. A disk-backed server pays real fsyncs for every checkpoint
    # that DROP DATABASE forces, which exceeded fixture cleanup bounds on hosted runners.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: |-
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "CI_DISCOVERY_PATH=$RUNNER_TEMP/evidence/$CI_LANE-$CI_SHARD.discovered.json"
            echo "CI_INVENTORY_PATH=$RUNNER_TEMP/evidence/$CI_LANE-$CI_SHARD.inventory.json"
            echo "OPENSTEER_LOCK_ORDER_TRACE=$RUNNER_TEMP/evidence/integration-$CI_SHARD.jsonl"
          } >> "$GITHUB_ENV"
        shell: bash
      - uses: ./.github/actions/ci-browser
      - name: Fetch the previous public release for compatibility journeys
        shell: bash
        run: |
          revision="$(sed -nE 's/^export const previousPublicRelease = "([0-9a-f]{40})";$/\1/p' apps/host/src/agents/previous-release-reader.test-support.ts)"
          test -n "$revision"
          git fetch --no-tags --depth=1 origin "$revision"
      - name: Pull the integration PostgreSQL image
        # Pulled here so a registry problem fails this step, not the launcher's 60 s bound.
        run: docker pull "$(node -p 'require("yaml").parse(require("node:fs").readFileSync("deploy/compose/compose.yaml", "utf8")).services.postgres.image')"
      - run: pnpm exec vitest list --config vitest.integration.config.ts --filesOnly --json "$CI_DISCOVERY_PATH"
      - shell: bash
        run: |
          set -o pipefail
          pnpm test:integration -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=junit --reporter=json --reporter=./scripts/ci-inventory-reporter.ts --outputFile.junit="$RUNNER_TEMP/evidence/integration-${{ matrix.shard }}.xml" --outputFile.json="$RUNNER_TEMP/evidence/integration-${{ matrix.shard }}.results.json" 2>&1 | tee "$RUNNER_TEMP/evidence/integration-${{ matrix.shard }}.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ matrix.shard }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
          if-no-files-found: error
  native-mac:
    name: native-mac (${{ matrix.task }})
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.native-mac != 'false' }}
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Tasks, timeouts and Swift cache inputs live in .github/scripts/ci-native-mac.json;
        # `changes` selects the tasks whose inputs this change touches.
        include: ${{ fromJSON(needs.changes.outputs.native-mac-tasks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - id: swift
        shell: bash
        env:
          SWIFT_INPUTS: ${{ matrix.swift }}
        run: |
          # The compiler, Xcode and SDK, not the runner image: SwiftPM revalidates a
          # restored build, so a key only decides how warm it starts.
          swift --version > "$RUNNER_TEMP/swift-toolchain"
          xcodebuild -version >> "$RUNNER_TEMP/swift-toolchain"
          xcrun --show-sdk-version >> "$RUNNER_TEMP/swift-toolchain"
          toolchain=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain" | cut -d' ' -f1)
          inputs=$(git ls-tree -r HEAD -- ${SWIFT_INPUTS:?} | shasum -a 256 | cut -d' ' -f1)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/apple-data/.build
            packages/apple-dictation/.build
            apps/mobile/modules/iphone-apps/ios/.build
            apps/desktop/native/computer-use/.build
            apps/desktop/native/passwords/.build
            apps/desktop/native/dictation/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ steps.swift.outputs.toolchain }}-${{ steps.swift.outputs.inputs }}
      - run: mkdir -p "$RUNNER_TEMP/evidence"
      - name: Build computer use helper
        if: matrix.task == 'computer-helper'
        run: pnpm --filter @opensteer/desktop build:computer-use-helper
      - name: Build and test dictation helper
        if: matrix.task == 'dictation-helper'
        run: |
          pnpm --filter @opensteer/desktop build:dictation-helper
          swift test --package-path apps/desktop/native/dictation
      - name: Build passwords broker
        if: matrix.task == 'passwords-helper'
        run: pnpm --filter @opensteer/desktop build:passwords-broker
      - name: Generate Apple data contracts
        if: matrix.task == 'iphone' || matrix.task == 'computer-tests'
        run: pnpm exec tsx scripts/generate-apple-data-contracts.ts
      - name: Test iPhone apps and native wire
        if: matrix.task == 'iphone'
        shell: bash
        run: |
          swift test --package-path packages/apple-data
          swift test --package-path apps/mobile/modules/iphone-apps/ios
          swift test --package-path apps/mobile/modules/dictation/ios
      - name: Test dictation
        if: matrix.task == 'dictation'
        run: |
          swift test --package-path packages/apple-dictation
      - name: Test computer use
        if: matrix.task == 'computer-tests'
        run: swift test --package-path apps/desktop/native/computer-use
      - name: Test passwords
        if: matrix.task == 'passwords-tests'
        run: |
          swift test --package-path apps/desktop/native/passwords
          swift test --package-path packages/macos-signing
      - name: Test native contracts and Darwin-only files
        if: matrix.darwin
        shell: bash
        env:
          CI_LANE: darwin
          CI_SHARD: 1
          CI_SHARDS: 1
          CI_DISCOVERY_PATH: ${{ runner.temp }}/evidence/darwin-1.discovered.json
          CI_INVENTORY_PATH: ${{ runner.temp }}/evidence/darwin-1.inventory.json
          # tests/iphone-apps-wire.test.ts, a Darwin-only file, runs the Swift wire core built above.
          OPENSTEER_IPHONE_APPS_NATIVE_TESTS: "1"
          # This task runs only when its inputs change; the trace proves its tests
          # read and launch nothing else.
          CI_ACCESS_TRACE: ${{ runner.temp }}/evidence/darwin-1.access.jsonl
        run: |
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/.github/scripts/ci-access-trace.mjs"
          pnpm exec vitest run tests/helper-data-contracts.test.ts packages/protocol/src/computer-use-helper-wire.test.ts packages/protocol/src/passwords-broker-wire.test.ts apps/desktop/src/computer-use/ apps/desktop/src/passwords/
          darwin_only=$(node .github/scripts/ci-test-files.mjs darwin-only)
          pnpm exec vitest list --filesOnly --json "$CI_DISCOVERY_PATH" $darwin_only
          pnpm exec vitest run $darwin_only --reporter=default --reporter=./scripts/ci-inventory-reporter.ts
          unset NODE_OPTIONS
          node .github/scripts/ci-native-access.mjs "$CI_ACCESS_TRACE" "${{ matrix.task }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-mac-${{ matrix.task }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ${{ matrix.darwin && 'error' || 'ignore' }}
  android:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: mkdir -p "$RUNNER_TEMP/evidence"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21.0.10+7.0.LTS
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-temurin-21.0.10+7.0.LTS-${{ hashFiles('apps/agent-phone/**/*.gradle*', 'apps/agent-phone/**/gradle-wrapper.properties', 'apps/agent-phone/**/gradle.properties', 'apps/agent-phone/**/*.versions.toml', 'apps/agent-phone/**/gradle.lockfile', 'apps/agent-phone/**/verification-metadata.xml') }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "13114758"
          packages: platforms;android-37.0 build-tools;36.0.0
      - shell: bash
        run: |
          set -o pipefail
          {
            OPENSTEER_WRITE_AGENT_PHONE_VECTORS=1 pnpm exec vitest run packages/runner-auth/src/agent-phone-vectors.test.ts
            (cd apps/agent-phone && OPENSTEER_WRITE_WIRE_FIXTURE=1 ./gradlew :app:lint :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug --no-daemon --rerun-tasks)
            git diff --exit-code -- packages/runner-auth/fixtures/agent-phone-vectors.json apps/agent-phone/app/src/test/resources/wire-fixture.json
            pnpm exec vitest run packages/runner-auth/src/agent-phone-vectors.test.ts packages/runner-auth/src/agent-phone-wire.test.ts
          } 2>&1 | tee "$RUNNER_TEMP/evidence/android.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
            apps/agent-phone/**/build/reports
            apps/agent-phone/**/build/test-results
            apps/agent-phone/**/build/outputs/apk/debug
          if-no-files-found: error
  browser-journeys:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.browser-journeys != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: |-
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "OPENSTEER_EXTENSION_REPORT=$RUNNER_TEMP/evidence/extension.json"
            echo "OPENSTEER_EXTENSION_SCREENSHOTS=$RUNNER_TEMP/evidence/extension-screenshots"
            echo "OPENSTEER_TRANSCRIPT_LINKS_E2E_ARTIFACT_DIR=$RUNNER_TEMP/evidence/transcript-links"
            echo "OPENSTEER_START_PAGE_COMPUTERS_E2E_ARTIFACT_DIR=$RUNNER_TEMP/evidence/start-page-computers"
          } >> "$GITHUB_ENV"
        shell: bash
      - uses: ./.github/actions/ci-browser
      - shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @opensteer/browser-extension build
            pnpm --filter @opensteer/browser-extension test:integration
            pnpm --filter @opensteer/web test:transcript-links
            pnpm --filter @opensteer/web test:start-page-computers
          } 2>&1 | tee "$RUNNER_TEMP/evidence/browser-journeys.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-journeys-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
            /tmp/opensteer-*-e2e
          if-no-files-found: error
  Check:
    timeout-minutes: 3
    if: always()
    needs:
      - changes
      - lint
      - build-types
      - tests
      - integration
      - native-mac
      - android
      - browser-journeys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - run: pnpm exec tsx scripts/ci-check.ts "$RUNNER_TEMP/evidence"
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
