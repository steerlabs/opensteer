name: Promote team servers
on:
  workflow_dispatch:
    inputs:
      provisioner_image:
        description: Published provisioner image pinned by digest
        required: true
        type: string
      host_image:
        description: Published team Host image pinned by digest
        required: true
        type: string
      source_revision:
        description: Full source commit SHA of both published images
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: promote-team-servers
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: teams
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PROVISIONER_IMAGE: ${{ inputs.provisioner_image }}
      TEAM_HOST_IMAGE: ${{ inputs.host_image }}
      SHA: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published images and their source
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main
          for image in "$PROVISIONER_IMAGE" "$TEAM_HOST_IMAGE"; do
            [[ $image =~ ^ghcr.io/steerlabs/opensteer-team-(provisioner|host)@sha256:[0-9a-f]{64}$ ]]
            docker pull "$image"
            revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            [[ $revision == "$SHA" ]]
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/920572344872/locations/global/workloadIdentityPools/github/providers/github-teams-deployer
          service_account: gha-teams-deployer@opensteer-admin.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395
        with:
          cluster_name: teams-1
          location: us-west1
          project_id: opensteer-prod
          use_dns_based_endpoint: true
      - run: bash .github/scripts/deploy-team-provisioner.sh "$PROVISIONER_IMAGE" "$TEAM_HOST_IMAGE" "$SHA"
