name: Desktop release
on:
  push:
    tags: ["desktop-v*.*.*", "v*.*.*-insider"]
  workflow_dispatch:
    inputs:
      ref:
        description: Main commit or ref to release
        default: main
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        required: true
      version:
        description: Exact numeric version (X.Y.Z on both channels)
        type: string
        required: true
      publish:
        description: Publish after approval (reuse an existing draft)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-desktop-${{ inputs.channel || (endsWith(github.ref_name, '-insider') && 'beta' || 'stable') }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  preflight:
    if: github.repository == 'steerlabs/opensteer'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          REF: ${{ inputs.ref || github.ref }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          sha=$(git rev-parse --verify --end-of-options "$REF^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          if [[ "$EVENT" == push ]]; then
            case "$TAG" in
              desktop-v*) CHANNEL=stable; VERSION=${TAG#desktop-v} ;;
              v*-insider) CHANNEL=beta; VERSION=${TAG#v}; VERSION=${VERSION%-insider} ;;
              *) exit 1 ;;
            esac
          fi
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          [[ "$VERSION" =~ ^$stable$ ]]
          case "$CHANNEL" in
            stable) tag="desktop-v$VERSION" ;;
            beta) tag="v$VERSION-insider" ;;
            *) exit 1 ;;
          esac
          manifest_version=$(git show "$sha:package.json" | jq -r .version)
          [[ "$manifest_version" == "$VERSION" ]]
          if [[ "$EVENT" == push ]]; then [[ "$TAG" == "$tag" ]]; fi
          # Never overwrite an existing tag with a different source.
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-parse "$tag^{commit}")" == "$sha" ]]
          fi
          reuse=false
          gh api --paginate repos/steerlabs/opensteer/releases > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$tag" '.[] | select(.tag_name == $tag)' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"; then
            jq -e '.draft == true' "$RUNNER_TEMP/release.json"
            mkdir "$RUNNER_TEMP/existing"
            gh release download "$tag" --repo steerlabs/opensteer --pattern release.json --dir "$RUNNER_TEMP/existing"
            jq -e --arg sha "$sha" --arg version "$VERSION" --arg channel "$CHANNEL" \
              '.sourceSha == $sha and .version == $version and .channel == $channel' "$RUNNER_TEMP/existing/release.json"
            reuse=true
          fi
          printf 'sha=%s\nchannel=%s\nversion=%s\ntag=%s\nreuse=%s\n' "$sha" "$CHANNEL" "$VERSION" "$tag" "$reuse" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    if: needs.preflight.outputs.reuse != 'true'
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    env:
      OPENSTEER_DESKTOP_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
      OPENSTEER_DESKTOP_TARGET_ARCH: arm64
      OPENSTEER_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      OPENSTEER_SOURCE_REVISION: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
      - run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
      - name: Build signed Agent Phone
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENSTEER_AGENT_PHONE_KEYSTORE_BASE64 }}
          OPENSTEER_AGENT_PHONE_KEYSTORE_PASSWORD: ${{ secrets.OPENSTEER_AGENT_PHONE_KEYSTORE_PASSWORD }}
          OPENSTEER_AGENT_PHONE_KEY_PASSWORD: ${{ secrets.OPENSTEER_AGENT_PHONE_KEYSTORE_PASSWORD }}
          OPENSTEER_AGENT_PHONE_KEY_ALIAS: ${{ vars.OPENSTEER_AGENT_PHONE_KEY_ALIAS }}
          OPENSTEER_AGENT_PHONE_KEYSTORE: ${{ runner.temp }}/release-keys/phone.keystore
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/release-keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OPENSTEER_AGENT_PHONE_KEYSTORE"
          pnpm build:agent-phone --release
      - name: Sign, notarize and staple desktop
        env:
          CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          PASSWORDS_PROFILE_BASE64: ${{ secrets.MACOS_PASSWORDS_PROVISIONING_PROFILE_BASE64 }}
          OPENSTEER_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          OPENSTEER_PASSWORDS_PROVISIONING_PROFILE: ${{ runner.temp }}/release-keys/passwords.provisionprofile
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/release-keys/AuthKey.p8
          CSC_LINK: ${{ runner.temp }}/release-keys/certificate.p12
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keys/certificate.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          printf '%s' "$PASSWORDS_PROFILE_BASE64" | base64 --decode > "$OPENSTEER_PASSWORDS_PROVISIONING_PROFILE"
          # Decrypt via environment, never a password argument. Import the PEM
          # into an ephemeral keychain; its empty password is not a credential.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/release-keys/certificate.p12" -nodes \
            -passin env:CSC_KEY_PASSWORD -out "$RUNNER_TEMP/release-keys/signing.pem"
          keychain="$RUNNER_TEMP/release-keys/signing.keychain-db"
          security create-keychain -p '' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p '' "$keychain"
          security import "$RUNNER_TEMP/release-keys/signing.pem" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '' "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p')
          echo "::add-mask::$identity"
          export OPENSTEER_RELEASE_SIGNING_IDENTITY="$identity" CSC_KEYCHAIN="$keychain"
          pnpm desktop:build-release --out "$RUNNER_TEMP/macos-build"
      - name: Verify and prepare exact release bytes
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Opensteer.app"
          if [[ "$OPENSTEER_DESKTOP_RELEASE_CHANNEL" == beta ]]; then
            app="$GITHUB_WORKSPACE/apps/desktop/release/beta/mac-arm64/Opensteer Beta.app"
          fi
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Opensteer.zip"
          pnpm desktop:public-release prepare --channel "$OPENSTEER_DESKTOP_RELEASE_CHANNEL" \
            --app-zip "$RUNNER_TEMP/Opensteer.zip" --version "$OPENSTEER_RELEASE_VERSION" \
            --source-sha "$OPENSTEER_SOURCE_REVISION" --out "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ needs.preflight.outputs.channel }}
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
      - name: Delete signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/release-keys/signing.keychain-db"
          trap 'rm -rf "$RUNNER_TEMP/release-keys"' EXIT
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/release-keys"
  draft:
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-${{ needs.preflight.outputs.channel }}
          path: ${{ runner.temp }}/prepared
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm desktop:public-release draft --dir "$RUNNER_TEMP/prepared" --repo steerlabs/opensteer
  publish:
    needs: [preflight, draft]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) && (needs.draft.result == 'success' || needs.preflight.outputs.reuse == 'true') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: pnpm desktop:public-release publish --repo steerlabs/opensteer --tag "$TAG"
